schema_version: 1

context:
  name: isofit
  version: "4.1.5"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/isofit-${{ version }}.tar.gz
  sha256: 76fda4e9e00c591f3c0e9a9ffb4589897e343c6b59deaa4ca77e729832efe878

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - isofit = isofit.__main__:cli

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
  run:
    - click
    - dask
    - h5py <=3.14.0
    - netCDF4 <1.7.4
    - numba
    - numpy >=2.0
    - pep8 >=1.7.1
    - pytest >=3.5.1
    - python >=${{ python_min }}
    - python-build
    - python-xxhash >=1.2.0
    - pytorch
    - pyyaml >=5.1.2
    - ray-default
    - scikit-image >=0.17.0
    - scikit-learn >=0.19.1
    - scipy >=1.3.0
    - spectral >=0.19
    - twine
    - xarray
    - zarr >=3

tests:
  - python:
      imports:
        - isofit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - isofit --version

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Imaging Spectrometer Optimal FITting (ISOFIT)
  description: |
    ISOFIT contains a set of routines and utilities for fitting surface,
    atmosphere and instrument models to imaging spectrometer data
  homepage: https://github.com/${{ name }}/${{ name }}
  repository: https://github.com/${{ name }}/${{ name }}
  documentation: https://github.com/${{ name }}/${{ name }}/wiki

extra:
  recipe-maintainers:
    - unbohn
    - pgbrodrick
    - davidraythompson
